name: Release to GitHub Packages

on:
  push:
    tags: 
    - "v*"
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v1
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build
    - name: Get Version
      id: version
      uses: battila7/get-version-action@v2
    - name: Pack nugets
      run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version-without-v }} --output .
    - name: Push to NuGet
      run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.PACKAGES }} -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json